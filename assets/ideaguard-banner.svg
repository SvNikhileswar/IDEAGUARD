<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080611"/>
      <stop offset="50%" stop-color="#190b30"/>
      <stop offset="100%" stop-color="#080611"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect x="4" y="4" width="1192" height="312" rx="18"
        fill="none" stroke="#a855f7" stroke-width="2" opacity=".8"/>

  <path d="M0 260 Q300 180 600 260 T1200 230"
        fill="none" stroke="#9333ea" stroke-width="2" opacity=".35"/>

  <g filter="url(#glow)" text-anchor="middle">
    <text x="600" y="130" font-family="Arial,sans-serif"
          font-size="76" font-weight="bold" fill="#f5f3ff">
      IDEAGUARD
    </text>
    <text x="600" y="185" font-family="Arial,sans-serif"
          font-size="23" fill="#c084fc">
      AI-POWERED PROJECT ORIGINALITY ANALYSIS
    </text>
  </g>

  <text x="600" y="245" font-family="Arial,sans-serif"
        font-size="17" fill="#d8b4fe" text-anchor="middle">
    PROTECT YOUR INNOVATION • DISCOVER WHAT'S DIFFERENT
  </text>
</svg>
